name: 면접 기출 수집

on:
  schedule:
    # 매월 1일 오전 9시(한국시간). 보고서 법정 공개일이 3월 31일이라
    # 4월 1일 실행에서 그 해 자료가 잡히고, 나머지 달은 늦게 올린 대학을 줍는다.
    - cron: "0 0 1 * *"
  workflow_dispatch:          # Actions 탭에서 직접 실행
    inputs:
      only:
        description: "특정 대학만 시험 실행 (쉼표 구분, 비우면 전체)"
        required: false
        default: ""
      no_refine:
        description: "언어모델 정리 생략"
        type: boolean
        default: false

permissions:
  contents: write             # 수집 결과를 저장소에 커밋하기 위해 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 수집 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/collect.py \
            ${{ github.event.inputs.only && format('--only "{0}"', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.no_refine == 'true' && '--no-refine' || '' }}

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json data/report.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "기출 자동 수집 $(date +%Y-%m-%d)"
            git push
          fi
