<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대입 면접 기출 자료실</title>
<style>
:root{
  --ink:#17233a; --ink2:#41506b; --ink3:#77859e;
  --paper:#ffffff; --bg:#eceff4; --line:#d5dbe5; --line2:#e6eaf1;
  --blue:#27518f; --blue-soft:#eaf0fa; --blue-line:#b9cbe8;
  --gold:#8a6a12; --gold-soft:#fbf3dd; --gold-line:#e3d19a;
  --red:#9b3030; --red-soft:#fbeeee;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.62;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}

/* ---------- 머리말 ---------- */
.masthead{background:var(--ink);color:#fff;padding:18px 20px 16px}
.mast-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between}
.mast-in h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
.mast-in h1 span{font-weight:400;color:#9fb0cc;font-size:14px;margin-left:10px;letter-spacing:0}
.mast-meta{font-size:12.5px;color:#9fb0cc}
.mast-meta b{color:#fff;font-weight:700}

/* ---------- 선택 패널 ---------- */
.picker{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px}
.picker-in{max-width:1180px;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.seg button{background:var(--paper);border:0;padding:7px 18px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.fields{display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1.3fr;gap:10px;align-items:end}
.f label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:4px;font-weight:600}
.f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.f input:focus,.f select:focus{outline:2px solid var(--blue-line);outline-offset:-1px;border-color:var(--blue)}
.hits{position:relative}
.dropdown{position:absolute;z-index:40;left:0;right:0;top:100%;background:var(--paper);border:1px solid var(--line);border-top:0;max-height:280px;overflow:auto;box-shadow:0 8px 20px rgba(23,35,58,.14)}
.dropdown div{padding:8px 11px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line2)}
.dropdown div:hover,.dropdown div.on{background:var(--blue-soft)}
.dropdown em{font-style:normal;color:var(--ink3);font-size:12px;margin-left:6px}
.chosen{margin-top:12px;font-size:14px;color:var(--ink2)}
.chosen b{color:var(--ink);font-size:17px;font-weight:800}
.chosen .clear{background:none;border:0;color:var(--ink3);cursor:pointer;text-decoration:underline;font-size:12.5px;margin-left:8px}

/* ---------- 탭 ---------- */
.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px;cursor:pointer;color:var(--ink3);font-weight:700;font-size:14.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tabs .n{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;background:var(--line);color:var(--ink2);border-radius:9px;font-size:11.5px;font-weight:700;vertical-align:1px}
.tabs button[aria-selected="true"] .n{background:var(--blue);color:#fff}

main{max-width:1180px;margin:0 auto;padding:20px 20px 70px}

/* ---------- 카드 ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card-hd .who{font-weight:800;font-size:15.5px}
.card-bd{padding:14px 16px}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:700;border:1px solid}
.t-year{background:var(--ink);color:#fff;border-color:var(--ink)}
.t-adm{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.t-src{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}
.t-gray{background:var(--bg);color:var(--ink2);border-color:var(--line)}

.qline{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
.qline:last-child{border-bottom:0}
.qnum{flex:0 0 22px;height:22px;border-radius:3px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.qtext{flex:1;font-size:15px}
.qtext .follow{display:block;margin-top:5px;padding-left:11px;border-left:2px solid var(--blue-line);color:var(--ink2);font-size:14px}
.meta{margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.meta div{margin-bottom:3px}
.meta b{color:var(--ink)}

/* ---------- 안내 박스 ---------- */
.note{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:var(--r);padding:13px 15px;font-size:13.5px;color:#5c470c;margin-bottom:16px}
.note b{color:#3d2f05}
.info{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:var(--r);padding:13px 15px;font-size:13.5px;color:#1d3d6b;margin-bottom:16px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

h2.sec{font-size:14px;font-weight:800;color:var(--ink2);margin:26px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}
h2.sec:first-child{margin-top:0}

/* ---------- 링크 목록 ---------- */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.lk{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;text-decoration:none;color:var(--ink)}
.lk:hover{border-color:var(--blue);background:var(--blue-soft)}
.lk strong{display:block;font-size:14px;margin-bottom:2px}
.lk span{font-size:12.5px;color:var(--ink3);word-break:break-all}

/* ---------- 표 ---------- */
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--ink2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border-radius:var(--r)}

/* ---------- 폼/버튼 ---------- */
.btn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{background:#0e1727}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--paper);color:var(--red);border:1px solid #d8b4b4}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.row .f input,.row .f select,.row .f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);min-height:110px;line-height:1.6}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--r);font-size:14px;z-index:99;box-shadow:0 6px 22px rgba(0,0,0,.25)}

details{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px}
summary{padding:11px 15px;cursor:pointer;font-weight:700;font-size:14.5px}
details[open] summary{border-bottom:1px solid var(--line2)}
details .dbody{padding:13px 15px;font-size:14px}
details ul{margin:6px 0;padding-left:19px}
details li{margin-bottom:5px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 13px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

@media(max-width:760px){
  .fields{grid-template-columns:1fr 1fr}
  .fields .f.wide{grid-column:1/-1}
  main{padding:16px 14px 60px}
  .picker{padding:13px 14px}
  .tabs{padding:0 14px}
  .mast-in h1{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-in">
    <h1>대입 면접 기출 자료실<span>대학 · 학과 · 전형별 최근 5년</span></h1>
    <div class="mast-meta">기준 <b id="mYear"></b>학년도 · 수록 범위 <b id="mRange"></b> · 문항 <b id="mCount"></b>건<span id="mSync"></span></div>
  </div>
</header>

<section class="picker">
  <div class="picker-in">
    <div class="seg" role="group">
      <button id="tp4" aria-pressed="true">4년제 대학</button>
      <button id="tp2" aria-pressed="false">전문대학</button>
    </div>
    <div class="fields">
      <div class="f wide hits">
        <label for="uq">대학</label>
        <input id="uq" autocomplete="off" placeholder="대학 이름을 입력하세요 (예: 부산대)">
        <div id="ud" class="dropdown" hidden></div>
      </div>
      <div class="f">
        <label for="fld">계열</label>
        <select id="fld"></select>
      </div>
      <div class="f">
        <label for="maj">학과 · 모집단위</label>
        <input id="maj" list="majors" autocomplete="off" placeholder="예: 컴퓨터공학과">
        <datalist id="majors"></datalist>
      </div>
      <div class="f">
        <label for="adm">전형</label>
        <select id="adm"></select>
      </div>
    </div>
    <div class="chosen" id="chosen"></div>
  </div>
</section>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="q" aria-selected="true">기출 문항<span class="n" id="nQ">0</span></button>
  <button role="tab" data-tab="t" aria-selected="false">면접 후기 · 팁</button>
  <button role="tab" data-tab="r" aria-selected="false">입시 결과</button>
  <button role="tab" data-tab="s" aria-selected="false">공식 원문 자료</button>
  <button role="tab" data-tab="d" aria-selected="false">자료 관리</button>
</nav>

<main>
  <div id="pane-q"></div>
  <div id="pane-t" hidden></div>
  <div id="pane-r" hidden></div>
  <div id="pane-s" hidden></div>
  <div id="pane-d" hidden></div>
</main>

═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   6. 저장소 (window.storage → localStorage → 메모리)
═══════════════════════════════════════════════════════════ */
const KEY = 'iv:data';
const mem = {};
const store = {
  async get(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return mem[KEY] || null;
  },
  async set(v){
    const s = JSON.stringify(v);
    mem[KEY] = v;
    try{ if(window.storage){ await window.storage.set(KEY, s); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, s); return true; }catch(e){}
    return false;
  }
};

let DATA = { questions: [], tips: [], results: [] };
let AUTO = [];          // 깃허브 액션이 매년 수집한 문항

const S = { type:'4년제', univ:null, field:'', major:'', adm:'', tab:'q', years:new Set(YEARS) };
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function allQ(){ return [...SEED_Q, ...AUTO, ...GIVEN.questions, ...DATA.questions]; }

function matchQ(){
  return allQ().filter(q => {
    if(S.univ && q.univ !== S.univ.name) return false;
    if(!S.univ && q.type !== S.type) return false;
    if(!S.years.has(q.year)) return false;
    if(S.field && q.field && q.field !== S.field) return false;
    if(S.adm && q.adm && !q.adm.includes(S.adm.split('(')[0])) return false;
    if(S.major){
      const k = S.major.replace(/(학과|학부|전공|과)$/,'');
      if(k && !(q.major||'').includes(k)) return false;
    }
    return true;
  }).sort((a,b) => b.year - a.year);
}

let dIdx = -1, dList = [];
function searchUniv(){
  const q = $('#uq').value.trim();
  const pool = UNIVS.filter(u => u.type === S.type);
  dList = (q ? pool.filter(u => u.name.includes(q) || u.region.includes(q)) : pool).slice(0,60);
  const d = $('#ud');
  if(!dList.length){ d.hidden = true; return; }
  d.innerHTML = dList.map((u,i) =>
    `<div data-i="${i}" class="${i===dIdx?'on':''}">${esc(u.name)}<em>${esc(u.region)}</em></div>`).join('');
  d.hidden = false;
}
function pickUniv(u){
  S.univ = u; $('#uq').value = u.name; $('#ud').hidden = true; dIdx = -1; render();
}
$('#uq').addEventListener('input', () => { dIdx = -1; S.univ = null; searchUniv(); render(); });
$('#uq').addEventListener('focus', searchUniv);
$('#uq').addEventListener('keydown', e => {
  if($('#ud').hidden) return;
  if(e.key === 'ArrowDown'){ dIdx = Math.min(dIdx+1, dList.length-1); searchUniv(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ dIdx = Math.max(dIdx-1, 0); searchUniv(); e.preventDefault(); }
  else if(e.key === 'Enter'){ if(dList[dIdx<0?0:dIdx]) pickUniv(dList[dIdx<0?0:dIdx]); e.preventDefault(); }
  else if(e.key === 'Escape'){ $('#ud').hidden = true; }
});
$('#ud').addEventListener('mousedown', e => {
  const el = e.target.closest('[data-i]'); if(el) pickUniv(dList[+el.dataset.i]);
});
document.addEventListener('click', e => { if(!e.target.closest('.hits')) $('#ud').hidden = true; });

    const qs = v('aQ').split('\n').map(x => x.trim()).filter(Boolean);

    DATA.questions.push({univ:v('aU'), type:S.type, year:+v('aY')||LATEST, adm:v('aA'), major:v('aM'),
      field:v('aF'), method:v('aMe'), qs, note:v('aN'), src:{k:v('aK'), t:v('aS')||'직접 입력', p:''}});

  };
  $('#addT').onclick = async () => {
    if(!v('tU') || !v('tT')) return toast('대학과 내용을 입력하세요.');
    DATA.tips.push({univ:v('tU'), year:+v('tY')||LATEST, major:v('tM'), text:v('tT'), src:v('tS')});
    await save(); toast('후기를 저장했습니다.'); render();

      cap:v('rC'), comp:v('rP'), fill:v('rF'), cut:v('rT'), src:v('rS')});

    a.download = `면접기출_${LATEST}학년도_${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };

      try{
        const j = JSON.parse(rd.result);
        DATA.questions = [...DATA.questions, ...(j.questions||[])];
        DATA.tips      = [...DATA.tips,      ...(j.tips||[])];
        DATA.results   = [...DATA.results,   ...(j.results||[])];
        await save(); toast('자료를 불러왔습니다.'); render();
      }catch(err){ toast('파일을 읽지 못했습니다. JSON 형식인지 확인하세요.'); }

    if(!confirm('직접 추가한 자료를 모두 지웁니다. 계속할까요?')) return;
    DATA = {questions:[], tips:[], results:[]};
    await save(); toast('추가분을 삭제했습니다.'); render();
  };
}

async function save(){
  const ok = await store.set(DATA);
  if(!ok) toast('이 환경에서는 저장이 되지 않습니다. 내보내기로 파일을 받아 두세요.');
}
let tT;
function toast(m){
  clearTimeout(tT);
  let el = $('.toast');
  if(!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = m;
  tT = setTimeout(() => el.remove(), 2800);
}

    ? `<b>${esc(u.name)}</b> <span class="tag t-gray">${esc(u.region)}</span> <span class="tag t-gray">${esc(u.type)}</span>
       ${S.major?`<span class="tag t-adm">${esc(S.major)}</span>`:''}
       <button class="clear" id="clr">선택 해제</button>`
    : `<span style="color:var(--ink3)">대학을 선택하면 그 대학의 공식 기출 원문과 입시결과 링크가 함께 나옵니다.</span>`;
  const c = $('#clr'); if(c) c.onclick = () => { S.univ = null; $('#uq').value = ''; render(); };

  if(S.tab === 'q') paneQ(); else $('#nQ').textContent = matchQ().length;
  if(S.tab === 't') paneT();
  if(S.tab === 'r') paneR();
  if(S.tab === 's') paneS();
  if(S.tab === 'd') paneD();
}

async function loadAuto(){
  try{
    const r = await fetch('./data/questions.json', {cache:'no-cache'});
    if(r.ok) AUTO = await r.json();
  }catch(e){ /* 파일 없이 단독 실행하는 경우 */ }
  try{
    const r = await fetch('./data/report.json', {cache:'no-cache'});
    if(r.ok) AUTOINFO = await r.json();
  }catch(e){}
  try{
    const r = await fetch('./data/contributed.json', {cache:'no-cache'});
    if(r.ok){ const j = await r.json();
      GIVEN = {questions:j.questions||[], tips:j.tips||[], results:j.results||[]}; }
  }catch(e){}
}

(async () => {
  const saved = await store.get();
  if(saved) DATA = Object.assign({questions:[],tips:[],results:[]}, saved);
  render();
  await loadAuto();
  render();
})();
</script>
</body>
</html>
