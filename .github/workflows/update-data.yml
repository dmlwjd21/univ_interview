name: Update public admissions data
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * 1'
permissions:
  contents: write
concurrency:
  group: admissions-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official and fallback sources
        run: python scripts/update_data.py --output update-candidates.json
      - name: Validate published JSON
        run: python scripts/update_data.py --validate-only
      - name: Commit verified structured updates and source fingerprints
        run: |
          git add data/admissions.json data/interviews.json data/metadata.json sources/checksums.json
          if git diff --cached --quiet; then
            echo "No publishable data or fingerprint changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update public admissions sources"
          git push origin HEAD:main
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-candidates
          path: update-candidates.json
          if-no-files-found: ignore
          retention-days: 30
